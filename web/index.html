<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="hurr-build" content="dev">
<title>حُرّ — HURR</title>
<style>
  @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-arabic-700-normal.woff2") format("woff2"); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-latin-500-normal.woff2") format("woff2"); font-weight: 500; unicode-range: U+0000-00FF; }
  :root { --ink: #fff4e6; --night: #14110f; --sand: #d9a07a; }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; touch-action: none;
    font-family: "Cairo", system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); transition: opacity .6s; z-index: 5; }
  #loading img { width: min(46vw, 260px); }
  #bar { width: min(60vw, 280px); height: 4px; background: #ffffff22; border-radius: 2px; margin: 28px auto 0; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--sand); transition: width .2s; }
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; left: 12px; display: flex;
    justify-content: space-between; align-items: center; font-size: 13px; pointer-events: none; text-shadow: 0 1px 3px #000a; }
  #title { font-weight: 700; font-size: 18px; }
  #hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); width: 100%; text-align: center; font-size: 13px;
    opacity: .85; pointer-events: none; text-shadow: 0 1px 3px #000a; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; background: var(--night); z-index: 6; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
  <div id="loading"><div><img src="assets/brand/aboden_logo.png" alt="عبودين قيمز — ABODEN GAMES"><div id="bar"><i></i></div></div></div>
  <div id="hud"><span id="title">حُرّ</span><span id="stats"></span></div>
  <div id="hint">اسحب لتدور حول نوف · قرّب بإصبعين · المس مرتين للعودة</div>
  <div id="err"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
