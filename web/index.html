<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="hurr-build" content="dev">
<title>حُرّ — HURR</title>
<style>
  @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-arabic-700-normal.woff2") format("woff2"); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Cairo"; src: url("assets/fonts/cairo-latin-500-normal.woff2") format("woff2"); font-weight: 500; unicode-range: U+0000-00FF; }
  :root { --ink: #fff4e6; --night: #14110f; --sand: #d9a07a; --glass: rgba(20, 14, 12, .38); }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; touch-action: none; overscroll-behavior: none;
    font-family: "Cairo", system-ui, sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  .layer { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; transition: opacity .6s; }
  .gone { opacity: 0; pointer-events: none; }
  #loading { background: var(--night); z-index: 9; }
  #loading img { width: min(46vw, 260px); }
  #bar { width: min(60vw, 280px); height: 4px; background: #ffffff22; border-radius: 2px; margin: 28px auto 0; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--sand); transition: width .2s; }
  #title { z-index: 8; background: linear-gradient(180deg, rgba(20,17,15,.15), rgba(20,17,15,.65)); }
  #title h1 { font-size: clamp(64px, 18vw, 120px); margin: 0; line-height: 1; text-shadow: 0 4px 24px #0008; }
  #title p { margin: 8px 0 0; font-size: 17px; opacity: .9; }
  #title .tap { margin-top: 38px; font-size: 15px; opacity: .8; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  #hint, #sub { position: fixed; left: 50%; transform: translateX(-50%); max-width: min(88vw, 520px); text-align: center; pointer-events: none;
    padding: 8px 16px; border-radius: 14px; background: var(--glass); opacity: 0; transition: opacity .35s; font-size: 15px; line-height: 1.5; }
  #hint { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 4px); }
  #sub { top: calc(max(14px, env(safe-area-inset-top)) + 4px); font-size: 17px; }
  #hint.on, #sub.on { opacity: 1; }
  .btn { position: fixed; display: grid; place-items: center; border-radius: 50%; color: var(--ink); font: 700 17px "Cairo", sans-serif;
    border: 2px solid #ffffff66; background: var(--glass); opacity: 0; transform: scale(.7); transition: opacity .2s, transform .2s; pointer-events: none; }
  .btn.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  #actBtn { width: 92px; height: 92px; right: max(22px, env(safe-area-inset-right)); bottom: calc(max(22px, env(safe-area-inset-bottom)) + 40px);
    background: conic-gradient(var(--sand) var(--p, 0%), var(--glass) 0); }
  #actBtn span { display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; background: rgba(20,14,12,.7); }
  #falconBtn { width: 104px; height: 104px; right: max(22px, env(safe-area-inset-right)); bottom: calc(max(22px, env(safe-area-inset-bottom)) + 150px);
    border-color: var(--sand); }
  #falconBtn.pulse { animation: pulse .8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 14px #d9a07a55; } }
  #falconBtn svg { width: 46px; height: 46px; display: block; margin: 0 auto -4px; }
  #stickBase { position: fixed; display: none; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    border: 2px solid #ffffff55; background: rgba(20,14,12,.18); pointer-events: none; }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; border-radius: 50%; background: #fff4e6cc; transform: translate(-50%,-50%); }
  #knot { position: fixed; inset: 0; width: 100vw; height: 100dvh; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 4; }
  #knot.on { opacity: 1; pointer-events: auto; }
  #knotPath { fill: none; stroke: #efe6d6; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 2 9; filter: drop-shadow(0 1px 3px #0009); }
  #knotBead { fill: #d9a07a; stroke: #fff4e6; stroke-width: 3; }
  #knot.slip #knotBead { fill: #c0392b; }
  #knotCount { fill: #fff4e6; font: 700 16px "Cairo", sans-serif; text-anchor: middle; paint-order: stroke; stroke: #0007; stroke-width: 3px; }
  #fade { position: fixed; inset: 0; background: #0b0807; opacity: 0; pointer-events: none; transition: opacity .7s; z-index: 6; }
  #fade.on { opacity: 1; } #fade.slow { transition: opacity 1.4s; }
  #end { z-index: 7; opacity: 0; pointer-events: none; padding: 24px; }
  #end.on { opacity: 1; pointer-events: auto; }
  #endLine { font-size: clamp(20px, 5.5vw, 30px); margin: 0 0 6px; }
  #end .who { opacity: .75; margin: 0 0 30px; }
  #end h2 { font-size: 18px; margin: 0; opacity: .9; } #endTime { opacity: .7; font-size: 14px; margin: 6px 0 22px; }
  #again { font: 700 17px "Cairo", sans-serif; color: var(--night); background: var(--sand); border: 0; border-radius: 24px; padding: 10px 30px; }
  #stats { position: fixed; top: 6px; right: 8px; font: 500 11px "Cairo", monospace; opacity: .7; pointer-events: none; direction: ltr; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; background: var(--night); z-index: 10; white-space: pre-line; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
  <div id="loading" class="layer"><div><img src="assets/brand/aboden_logo.png" alt="عبودين قيمز — ABODEN GAMES"><div id="bar"><i></i></div></div></div>
  <div id="title" class="layer"><div><h1>حُرّ</h1><p>المرحلة الأولى · الصقر الذي لا يعود</p><div class="tap">المس الشاشة للبدء</div></div></div>
  <div id="hint"></div>
  <div id="sub"></div>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <button id="actBtn" class="btn" aria-label="فكّ الشبكة"><span>فكّ</span></button>
  <button id="falconBtn" class="btn" aria-label="انقضّ">
    <span><svg viewBox="0 0 48 48" fill="none" stroke="#fff4e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c8-2 13 1 20 8 7-7 12-10 20-8-6 2-10 6-13 12l-7 10-7-10C14 24 10 20 4 18z"/></svg>انقضّ</span>
  </button>
  <svg id="knot" xmlns="http://www.w3.org/2000/svg"><path id="knotPath" d=""/><circle id="knotBead" r="16" cx="0" cy="0"/><text id="knotCount" x="50%" y="30%"></text></svg>
  <div id="fade"></div>
  <div id="end" class="layer"><div><p id="endLine"></p><p class="who">— عبودين</p><h2>نهاية المقطع الأول من المرحلة 1</h2><p id="endTime"></p><button id="again">إعادة</button></div></div>
  <div id="stats"></div>
  <div id="err"></div>
  <script type="module" src="src/game.js"></script>
</body>
</html>
