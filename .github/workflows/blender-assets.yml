name: HURR Blender assets
on:
  workflow_dispatch:
  push:
    branches: [web]
    paths: ['tools/blender/**', '.github/workflows/blender-assets.yml']
permissions:
  contents: write
concurrency:
  group: blender-assets
  cancel-in-progress: true
jobs:
  weights:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2 LTS (newest patch, SHA-256 verified)
        run: |
          set -euo pipefail
          base=https://download.blender.org/release/Blender4.2
          ver=$(curl -fsSL "$base/" | grep -oE 'blender-4\.2\.[0-9]+-linux-x64\.tar\.xz' | sort -V | uniq | tail -1 | sed -E 's/blender-(4\.2\.[0-9]+)-linux-x64\.tar\.xz/\1/')
          echo "Blender $ver"
          curl -fsSL -o blender.tar.xz "$base/blender-$ver-linux-x64.tar.xz"
          curl -fsSL -o blender.sha256 "$base/blender-$ver.sha256"
          want=$(grep "linux-x64.tar.xz" blender.sha256 | awk '{print $1}')
          echo "$want  blender.tar.xz" | sha256sum -c -
          mkdir -p /opt/blender && tar -xf blender.tar.xz -C /opt/blender --strip-components=1
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 >/dev/null
          /opt/blender/blender --version | head -1
      - name: Heat weights (direct + voxel proxy)
        run: /opt/blender/blender -b --factory-startup -P tools/blender/heat_weights.py -- assets/models/nouf_20k.glb tools/blender/out
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/out
          git commit -m "Blender heat weights (CI run ${{ github.run_number }}) [skip ci]" || echo "no changes"
          git push
