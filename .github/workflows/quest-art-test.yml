name: HURR Quest APK - Art Test
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'platforms;android-34' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hurr-development-signing-v1
      - name: Create development signing key when absent
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=HURR Development,O=ABODEN GAMES,C=SA'
          fi
      - name: Install verified Godot and OpenXR Vendors
        run: python3 tools/ci/setup_ci.py
      - name: Import resources
        run: godot --headless --xr-mode off --path . --import
      - name: Automated scene tests
        run: timeout 180 godot --headless --xr-mode off --path . --script res://tests/test_art_scene.gd
      - name: Render desktop previews (gl_compatibility, not the Quest renderer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          for s in front wide face; do
            timeout 120 xvfb-run -a -s "-screen 0 1600x900x24" godot --rendering-driver opengl3 --rendering-method gl_compatibility --xr-mode off --path . -- --preview --shot=$s
          done
      - name: Export native ARM64 Android APK
        run: godot --headless --xr-mode off --path . --install-android-build-template --export-debug Quest build/HURR-ArtTest.apk
      - name: Verify manifest, ABI, splash and signature
        run: python3 tools/ci/verify_apk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HURR-ArtTest-quest
          path: build/
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK as a release asset (direct download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="art-test-${{ github.run_number }}"
          gh release create "$tag" build/HURR-ArtTest.apk build/HURR-ArtTest.apk.sha256 build/package-report.json \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "HURR Art Test #${{ github.run_number }}" \
            --notes "Development-signed Quest 3 build. Built and package-verified in CI; not yet installed or play-tested on a headset."
